[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "air-alerts-analysis"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.14", "scikit-learn>=1.7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
